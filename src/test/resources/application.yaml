spring:
  datasource:
    url: jdbc:h2:mem:abc_bank;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      # Tests build the schema from the entities instead of requiring a MySQL instance.
      ddl-auto: create-drop

banking:
  security:
    encryption:
      # Fixed throwaway key so tests are deterministic. Never use this outside tests.
      aes-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
